apiVersion: batch/v1
kind: Job
metadata:
  name: prefetch-models
  namespace: dynamo
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      volumes:
      - name: hf-cache
        hostPath:
          path: /opt/hf-cache
          type: DirectoryOrCreate
      containers:
      - name: prefetch
        image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          mkdir -p /hf-cache && chmod 777 /hf-cache
          echo "Downloading google/diffusiongemma-26B-A4B-it..."
          python3 -c "
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='google/diffusiongemma-26B-A4B-it',
              revision='f7f5b7f5fa82ffc52addd066915886d497f5517b',
              cache_dir='/hf-cache')
          print('diffusiongemma done')
          "
          echo "Downloading Qwen/Qwen3.6-35B-A3B-FP8..."
          python3 -c "
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='Qwen/Qwen3.6-35B-A3B-FP8',
              revision='95a723d08a9490559dae23d0cff1d9466213d989',
              cache_dir='/hf-cache')
          print('qwen done')
          "
          echo "All models downloaded."
        envFrom:
        - secretRef:
            name: hf-token-secret
        env:
        - name: HF_HOME
          value: /hf-cache
        volumeMounts:
        - name: hf-cache
          mountPath: /hf-cache
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
