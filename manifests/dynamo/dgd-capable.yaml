apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: capable
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
          envFrom:
          - secretRef:
              name: hf-token-secret

  - name: VllmDecodeWorker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        volumes:
        - name: hf-cache
          hostPath:
            path: /opt/hf-cache
            type: DirectoryOrCreate
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
          securityContext:
            runAsUser: 0
          livenessProbe:
            httpGet:
              path: /live
              port: system
            initialDelaySeconds: 0
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 10
          command: ["python3", "-m", "dynamo.vllm"]
          args:
          - --model
          - /hf-cache/models--Qwen--Qwen3.6-35B-A3B-FP8/snapshots/95a723d08a9490559dae23d0cff1d9466213d989
          - --served-model-name
          - capable
          - --max-model-len
          - "8192"
          - --gpu-memory-utilization
          - "0.90"
          envFrom:
          - secretRef:
              name: hf-token-secret
          env:
          - name: HF_HOME
            value: /hf-cache
          # Uncomment if "no kernel image available" errors appear (sm_120 Blackwell fallback):
          # - name: VLLM_ATTENTION_BACKEND
          #   value: TRITON_ATTN
          volumeMounts:
          - name: hf-cache
            mountPath: /hf-cache
          resources:
            limits:
              nvidia.com/gpu: "1"
